[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch-analyzer"
version = "0.1.0"
description = "Privacy-first Windows network and storage monitoring desktop application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psutil>=5.9",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netwatch = "netwatch.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["netwatch*"]
